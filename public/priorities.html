<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invincible YOU · Strategic Priorities</title>
  <link rel="icon" href="/iy-lockup.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Same Invincible YOU theme as the other pages (slate scale flipped light, blue = IY purple).
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Source Sans 3"', 'Arial', 'sans-serif'], serif: ['Literata', 'Georgia', 'serif'] },
          colors: {
            slate: { 100: '#1a1a1a', 200: '#1a1a1a', 300: '#364153', 400: '#484848', 500: '#6a7282', 600: '#8a8a8a', 700: '#e5e7eb', 800: '#f3f4f6', 900: '#ffffff', 950: '#fafafa' },
            blue: { 50: '#f8eefb', 100: '#f0dcf6', 200: '#e0b8ec', 300: '#680087', 400: '#680087', 500: '#7a1a9a', 600: '#680087', 700: '#550070', 800: '#440158', 900: '#190021', 950: '#10001a' },
            indigo: { 500: '#7a1a9a', 600: '#680087' },
            // darker accents for readability on white (same as the Expense Dashboard)
            emerald: { 300: '#047857', 400: '#047857' },
            amber: { 300: '#b45309', 400: '#b45309' },
            red: { 300: '#cc0000', 400: '#cc0000' },
          }
        }
      }
    }
  </script>
  <script src="/modules.js"></script>
  <style>h1, h2, h3 { font-family: Literata, Georgia, serif; }</style>
</head>
<!-- Strategic Priorities module: named shortcuts to Project Tracker projects (admin adds/deletes,
     management views). Data: /api/data?view=priorities, each board via /api/data?view=priority&id=. -->
<body class="min-h-full font-sans antialiased text-slate-200 bg-slate-950">
  <header class="border-b border-slate-700 bg-white/90 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16 gap-3">
      <div class="flex items-center gap-4 min-w-0">
        <img src="/iy-lockup.png" alt="Invincible YOU" class="h-7 sm:h-9 w-auto">
        <div class="hidden md:block border-l border-slate-700 pl-4 min-w-0">
          <h1 class="text-base font-semibold tracking-tight text-slate-100 truncate">Strategic Priorities</h1>
          <p class="text-xs text-slate-400 truncate">Pending and completed stages</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <nav id="moduleNav" class="hidden flex items-center gap-1 bg-slate-800 border border-slate-700 rounded-lg p-1"></nav>
        <span id="currentUser" class="hidden sm:inline text-xs text-slate-400"></span>
        <button onclick="logout()" title="Sign out" aria-label="Sign out" class="p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Quick view of selected Project Tracker projects -->
    <div class="space-y-5">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-100">Strategic Priorities</h2>
          <p class="text-xs text-slate-400">Pending and completed stages</p>
        </div>
        <button id="addPriorityBtn" onclick="openPriorityModal()" style="display:none" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition items-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-plus"></i> Add Strategic Priority
        </button>
      </div>
      <div id="prioritySubTabs" class="flex flex-wrap gap-2"></div>
      <div id="priorityBoard"></div>
    </div>

  </main>

  <!-- MODAL: ADD STRATEGIC PRIORITY -->
  <div id="priorityModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/80">
        <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-bullseye text-indigo-400"></i> Add Strategic Priority</h3>
        <button onclick="closePriorityModal()" aria-label="Close" class="text-slate-400 hover:text-slate-100 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="priorityForm" onsubmit="savePriority(event)" class="p-6 space-y-4">
        <div>
          <label for="prioName" class="block text-xs font-medium text-slate-300 mb-1">Name *</label>
          <input type="text" id="prioName" required maxlength="80" placeholder="e.g. New campus launch" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label for="prioUrl" class="block text-xs font-medium text-slate-300 mb-1">Project view link *</label>
          <input type="url" id="prioUrl" required maxlength="500" placeholder="https://…/project-board.html?t=…" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          <p class="text-[11px] text-slate-400 mt-1">In the Project Tracker, copy it with the link icon on the project's card.</p>
        </div>
        <div class="pt-4 border-t border-slate-800 flex justify-end space-x-3">
          <button type="button" onclick="closePriorityModal()" class="px-4 py-2 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Cancel</button>
          <button type="submit" id="prioSave" class="px-5 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition disabled:opacity-60">Add</button>
        </div>
      </form>
    </div>
  </div>


  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    let state = { role: '', priorities: [] };

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    async function api(method, query = '', body) {
      const res = await fetch('/api/data' + query, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = '/payouts.html?next=priorities'; throw new Error('Please sign in'); }
      if (res.status === 403) { location.href = '/payouts.html'; throw new Error('Please sign in'); }
      if (!res.ok) throw new Error(data.error || 'Something went wrong, please try again');
      return data;
    }

    function applyState(data) {
      state = { role: data.role, priorities: data.priorities || [] };
      document.getElementById('currentUser').innerText = data.user || '';
      renderModules(document.getElementById('moduleNav'), { role: data.role, ptLinked: data.ptLinked, current: 'priorities' });
    }

    // Add / delete (admin): the server answers with the updated list.
    async function change(method, query, body) {
      try {
        applyState(await api(method, query, body));
        return true;
      } catch (e) {
        if (e.message !== 'Please sign in') showToast(e.message, 'error');
        return false;
      }
    }

    function showToast(msg, type = 'info') {
      const cls = type === 'success' ? 'border-emerald-500 text-emerald-700' : type === 'error' ? 'border-red-500 text-red-700' : 'border-blue-500 text-blue-700';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2 bg-white border ${cls} px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium`;
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${esc(msg)}</span>`;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.href = '/payouts.html';
    }

    // STRATEGIC PRIORITIES: sub-tabs = selected Project Tracker projects (view links); admin adds/deletes.
    let activePriority = null;
    let priorityReq = 0;
    const isAdmin = () => state.role === 'admin';

    function renderPriorityTabs() {
      const list = state.priorities || [];
      document.getElementById('addPriorityBtn').style.display = isAdmin() ? 'inline-flex' : 'none';
      if (!list.some((p) => p.id === activePriority)) activePriority = list[0]?.id || null;
      document.getElementById('prioritySubTabs').innerHTML = list.map((p) => {
        const on = p.id === activePriority;
        return `<span class="inline-flex items-center rounded-full border text-xs font-semibold ${on ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">
          <button class="pl-3 ${isAdmin() ? 'pr-1.5' : 'pr-3'} py-1.5" onclick="selectPriority('${p.id}')">${esc(p.name)}</button>
          ${isAdmin() ? `<button class="pr-2.5 pl-1 py-1.5 ${on ? 'text-white/80 hover:text-white' : 'text-slate-500 hover:text-red-400'}" title="Delete ${esc(p.name)}" aria-label="Delete ${esc(p.name)}" onclick="deletePriority('${p.id}')"><i class="fa-solid fa-xmark"></i></button>` : ''}
        </span>`;
      }).join('');
      if (!list.length) {
        document.getElementById('priorityBoard').innerHTML = `<p class="text-sm text-slate-400">${isAdmin()
          ? 'No strategic priorities yet. Use Add Strategic Priority and paste a project\'s view link from the Project Tracker.'
          : 'No strategic priorities yet.'}</p>`;
      }
    }

    function selectPriority(id) {
      activePriority = id;
      renderPriorityTabs();
      loadPriorityBoard();
    }

    async function loadPriorityBoard() {
      renderPriorityTabs();
      if (!activePriority) return;
      const board = document.getElementById('priorityBoard');
      const req = ++priorityReq;
      board.innerHTML = '<p class="text-sm text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading stages…</p>';
      try {
        const data = await api('GET', `?view=priority&id=${encodeURIComponent(activePriority)}`);
        if (req === priorityReq) board.innerHTML = priorityStagesHtml(data.stages || []);
      } catch (e) {
        if (req === priorityReq) board.innerHTML = `<p class="text-sm text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${esc(e.message)}</p>`;
      }
    }

    function openPriorityModal() {
      document.getElementById('priorityForm').reset();
      document.getElementById('priorityModal').classList.remove('hidden');
      document.getElementById('prioName').focus();
    }
    function closePriorityModal() { document.getElementById('priorityModal').classList.add('hidden'); }

    async function savePriority(e) {
      e.preventDefault();
      const btn = document.getElementById('prioSave');
      btn.disabled = true;
      const before = new Set((state.priorities || []).map((p) => p.id));
      const ok = await change('POST', '', { type: 'priority', item: { name: document.getElementById('prioName').value, url: document.getElementById('prioUrl').value } });
      btn.disabled = false;
      if (!ok) return;
      closePriorityModal();
      activePriority = (state.priorities || []).find((p) => !before.has(p.id))?.id || activePriority;
      showToast('Strategic priority added', 'success');
      loadPriorityBoard();
    }

    async function deletePriority(id) {
      const p = (state.priorities || []).find((x) => x.id === id);
      if (!p || !confirm(`Delete the strategic priority "${p.name}"? The project itself stays in the Project Tracker.`)) return;
      if (await change('DELETE', `?type=priority&id=${encodeURIComponent(id)}`)) {
        showToast('Strategic priority deleted', 'success');
        loadPriorityBoard();
      }
    }

    // Stage cards, same layout as the Project Tracker's view-only board (without its top banner and badges).
    function priorityStagesHtml(stages) {
      const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const dmy = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1]} ${y.slice(2)}`; };
      const today = ymd(new Date());
      const urgency = (st) => {
        if (st.isCompleted) return 'done';
        let start = st.calculatedDueDate;
        if (st.durationDays != null) { const d = new Date(st.calculatedDueDate + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - st.durationDays); start = d.toISOString().split('T')[0]; }
        return st.calculatedDueDate < today ? 'overdue' : (start <= today || st.status === 'In progress') ? 'today' : 'upcoming';
      };
      // text with web addresses made into links (everything escaped)
      const linkify = (value) => {
        const text = String(value ?? ''); const re = /\b((?:https?:\/\/|www\.)[^\s<>"']+)/gi; let out = '', last = 0, m;
        while ((m = re.exec(text))) {
          let url = m[1]; const trail = url.match(/[.,;:!?)\]}'"]+$/); if (trail) url = url.slice(0, -trail[0].length);
          const href = /^www\./i.test(url) ? 'https://' + url : url;
          out += esc(text.slice(last, m.index)) + `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="text-blue-400 underline decoration-dotted underline-offset-2 break-all">${esc(url)}</a>`;
          last = m.index + url.length; re.lastIndex = last;
        }
        return out + esc(text.slice(last));
      };
      const pill = (st) => ({ 'Not started': 'bg-slate-800 text-slate-400', 'In progress': 'bg-amber-500/15 text-amber-400' })[st.status]
        ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${({ 'Not started': 'bg-slate-800 text-slate-400', 'In progress': 'bg-amber-500/15 text-amber-400' })[st.status]} whitespace-nowrap">${st.status}</span>` : '';
      const stageNo = (st) => `<span class="text-[11px] text-slate-400 bg-slate-800 border border-slate-700 rounded px-1.5 shrink-0">Stage ${st.stagePosition} / ${st.stageTotal}</span>`;
      const owner = (st) => `<span class="inline-flex items-center gap-1 text-[11px] ${st.effectiveOwnerName ? 'text-slate-300' : 'text-slate-500'}"><i class="fa-solid fa-user-tie text-blue-400"></i>${st.effectiveOwnerName ? esc(st.effectiveOwnerName) : 'Unassigned'}</span>`;
      const pendingCard = (st) => {
        const u = urgency(st);
        const dateCls = u === 'overdue' ? 'text-red-400' : u === 'today' ? 'text-amber-400' : 'text-slate-400';
        return `<div class="bg-slate-900 p-3 rounded-lg border ${u === 'overdue' ? 'border-red-500/40' : 'border-slate-700'}">
          <div class="flex justify-between items-start gap-2"><h4 class="font-bold text-sm text-slate-100 break-words">${esc(st.stageName)} ${pill(st)}</h4>${stageNo(st)}</div>
          <p class="text-xs ${dateCls} mt-1"><i class="fa-regular fa-calendar mr-1 opacity-60"></i>Completes ${esc(dmy(st.calculatedDueDate))}${st.durationDays != null ? ` (${st.durationDays} day${st.durationDays === 1 ? '' : 's'})` : ''}${u === 'overdue' ? ' · overdue' : u === 'today' ? ' · today' : ''}</p>
          ${st.remarks ? `<p class="text-xs text-slate-400 mt-1.5 break-words whitespace-pre-line">${linkify(st.remarks)}</p>` : ''}
          <div class="mt-1.5">${owner(st)}</div></div>`;
      };
      const doneCard = (st) => {
        const doneOn = st.completedAt ? ymd(new Date(st.completedAt)) : null;
        const late = doneOn && doneOn > st.calculatedDueDate ? Math.round((Date.parse(doneOn) - Date.parse(st.calculatedDueDate)) / 86400000) : 0;
        const timing = !doneOn ? '<span class="text-slate-500">completion date not recorded</span>'
          : late ? `<span class="text-red-400">${late} day${late === 1 ? '' : 's'} late</span>` : '<span class="text-emerald-400">on time</span>';
        const logs = st.logs || [];
        return `<div class="bg-slate-900 p-3 rounded-lg border border-emerald-500/25">
          <div class="flex justify-between items-start gap-2"><h4 class="font-bold text-sm text-slate-100 break-words"><i class="fa-solid fa-circle-check text-emerald-400 mr-1.5"></i>${esc(st.stageName)}</h4>${stageNo(st)}</div>
          <p class="text-xs text-slate-400 mt-1">${doneOn ? `Completed ${esc(dmy(doneOn))} · ` : ''}Due ${esc(dmy(st.calculatedDueDate))} · ${timing}</p>
          ${st.remarks ? `<p class="text-xs text-slate-300 mt-1.5 break-words whitespace-pre-line">${linkify(st.remarks)}</p>` : ''}
          <div class="mt-1.5">${owner(st)}</div>
          ${logs.length ? `<details class="mt-2 pt-2 border-t border-slate-800"><summary class="text-[11px] text-blue-400 cursor-pointer select-none"><i class="fa-solid fa-book mr-1"></i>Log (${logs.length})</summary>
            <div class="mt-1.5 space-y-1.5">${logs.map((l) => `<div class="text-xs"><span class="text-[11px] text-slate-500">${esc(dmy(ymd(new Date(l.createdAt))))}</span>
              <p class="text-slate-300 whitespace-pre-line break-words">${linkify(l.entry)}${l.author && !String(l.entry).endsWith(l.author) ? ` <span class="text-[11px] text-slate-500">· by ${esc(l.author)}</span>` : ''}</p></div>`).join('')}</div></details>`
            : '<p class="text-[11px] text-slate-500 mt-2">No log entries.</p>'}</div>`;
      };
      const all = stages.slice().sort((a, b) => a.stagePosition - b.stagePosition);
      const pending = all.filter((st) => !st.isCompleted);
      const completed = all.filter((st) => st.isCompleted)
        .sort((a, b) => (b.completedAt || b.calculatedDueDate).localeCompare(a.completedAt || a.calculatedDueDate));
      return `<section>
          <h3 class="font-bold text-amber-400 mb-3"><i class="fa-solid fa-hourglass-half mr-2"></i>Pending <span class="text-slate-400 font-normal text-sm">(${pending.length})</span></h3>
          ${pending.length ? `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 items-start">${pending.map(pendingCard).join('')}</div>`
            : `<p class="text-sm text-slate-500">${all.length ? 'Nothing pending: all stages are done.' : 'No stages yet.'}</p>`}
        </section>
        <details class="mt-6 bg-slate-900/60 border border-emerald-500/30 rounded-xl p-4">
          <summary class="font-bold text-emerald-400 cursor-pointer select-none"><i class="fa-solid fa-circle-check mr-2"></i>Completed <span class="text-slate-400 font-normal text-sm">(${completed.length})</span></summary>
          ${completed.length ? `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 items-start mt-4">${completed.map(doneCard).join('')}</div>`
            : '<p class="text-sm text-slate-500 mt-3">No stages completed yet.</p>'}
        </details>`;
    }


    (async () => {
      try {
        applyState(await api('GET', '?view=priorities'));
        loadPriorityBoard();
      } catch (e) {
        if (e.message !== 'Please sign in') document.getElementById('priorityBoard').innerHTML = `<p class="text-sm text-red-700">${esc(e.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
